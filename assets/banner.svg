<svg fill="none" viewBox="0 0 1200 300" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .pulse-line {
        stroke-dasharray: 10, 200;
        animation: dash 4s linear infinite;
      }
      .node-pulse {
        animation: pulse 2s ease-in-out infinite alternate;
      }
      @keyframes dash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.5; }
        100% { r: 8px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Network Dynamic Lines (Background Layer) -->
  <g opacity="0.4">
    <path d="M 100 220 Q 300 100 600 200 T 1100 150" stroke="url(#line-grad)" stroke-width="2" fill="none"/>
    <path d="M 50 120 Q 400 250 800 100 T 1150 220" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
    
    <!-- Animated pulses on connection lines -->
    <path d="M 100 220 Q 300 100 600 200 T 1100 150" stroke="#38bdf8" stroke-width="3" fill="none" class="pulse-line"/>
    <path d="M 50 120 Q 400 250 800 100 T 1150 220" stroke="#c084fc" stroke-width="3" fill="none" class="pulse-line" style="animation-delay: 2s;"/>

    <!-- Dynamic Nodes -->
    <circle cx="300" cy="140" r="5" fill="#38bdf8" class="node-pulse"/>
    <circle cx="600" cy="200" r="6" fill="#818cf8" class="node-pulse" style="animation-delay: 0.7s;"/>
    <circle cx="800" cy="130" r="5" fill="#c084fc" class="node-pulse" style="animation-delay: 1.4s;"/>
  </g>

  <!-- Title & Subtitle (Foreground Layer - Clear & Unobstructed) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="125" fill="url(#title-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="0.5">
      Awesome Dedicated Network Interconnect
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      ⚡ Private Cloud Connectivity • Ethernet Fabric • Network-as-a-Service (NaaS) ⚡
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 220)">
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="0" y="4" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Azure ExpressRoute</text>
      </g>
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4"/>
        <text x="0" y="4" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">AWS Direct Connect</text>
      </g>
      <g transform="translate(75, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4"/>
        <text x="0" y="4" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">Google Interconnect</text>
      </g>
      <g transform="translate(230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4"/>
        <text x="0" y="4" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Equinix &amp; Megaport</text>
      </g>
    </g>
  </g>
</svg>
